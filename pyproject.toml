[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "reviewmate"
version = "0.1.0"
description = "AI-assisted Git diff code review CLI"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "pydantic>=2.7", "python-dotenv>=1.0", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
reviewmate = "reviewmate.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/reviewmate"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
